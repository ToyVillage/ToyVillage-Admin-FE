name: PR format

# 커밋 메시지와 PR 제목이 harness/shared/team-rules.md 2·3절 형식을 따르는지 본다.
# 제목만 고쳐도 다시 돌도록 edited 를 받는다. ci.yml 에 넣으면 PR 본문을 고칠 때마다 e2e 가 취소·재실행된다.
on:
  pull_request:
    branches: [develop]
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: pr-format-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr-format:
    name: commit·PR format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          # 이 job 은 push 하지 않는다. 토큰을 .git/config 에 남기지 않는다.
          persist-credentials: false
          # base..head 커밋을 git log 로 읽으려면 두 쪽 이력이 모두 있어야 한다.
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # 제목·브랜치 이름은 PR 작성자가 정하는 값이라 run 에 직접 넣지 않고 env 로 넘긴다.
      - run: node scripts/check-pr-format.mjs
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          COMMIT_RANGE: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
